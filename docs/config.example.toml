# rgit configuration.
#
# Copy to one of (first that exists wins):
#   $RGIT_CONFIG
#   $XDG_CONFIG_HOME/rgit/config.toml
#   ~/.config/rgit/config.toml
#
# Every key is optional; omitted keys keep their defaults. Unknown keys are an
# error (so typos surface instead of being silently ignored).

[theme]
# Built-in palette: mono, catppuccin, gruvbox, nord, dracula, tokyonight,
# rose-pine, rust, or "terminal" to adopt your terminal's own 16-color scheme.
# Omit `name` entirely and rgit defaults to "terminal", inheriting your
# terminal/tmux colors so it matches the rest of your setup.
name = "rose-pine"

# Per-role color overrides, "#rrggbb". Each is layered on top of the named
# palette (or the terminal theme), so you can tweak individual roles without
# defining a whole palette - e.g. keep rose-pine but use a warmer accent:
#
#   [theme]
#   name    = "rose-pine"
#   accent  = "#ea9a97"   # rose, instead of the default iris
#   added   = "#95b1ac"   # a softer green for +lines
#
# Every role (malformed values are ignored):
# accent         = "#c4a7e7"   # headers, keys, focus, branch glyph
# section_header = "#c4a7e7"
# field_label    = "#f6c177"   # Head:/Push: labels, function names
# branch         = "#9ccfd8"   # branch/remote names, type names
# hash           = "#f6c177"   # commit ids, numeric literals
# dim            = "#6e6a86"   # metadata, comments, secondary text
# added          = "#3e8fb0"   # +lines, staged, strings
# modified       = "#f6c177"
# deleted        = "#eb6f92"   # -lines, deleted files
# untracked      = "#ea9a97"
# cursor_bg      = "#44415a"   # the row under the cursor, keycaps
# select_bg      = "#393552"   # visual selection

[ui]
# How many commits the log view walks by default.
log_limit = 200
# Show the side preview pane (status and log views). Set false, or pass
# --no-preview, for a single full-width column - handy when embedding rgit in a
# narrow editor split (vim/lazygit style).
preview = true
# Keep the operation console (push/pull/fetch/commit output, shown as a docked
# bottom pane) open after a SUCCESSFUL run until you press q/Esc, so all output
# stays readable. A failed run always stays open. Default false = a successful
# run closes the pane automatically.
console_hold = false
# Glyph palette (three choices):
#   "unicode" (default) - unicode symbols (fold chevrons, bars, arrows), no
#                         nerd-font icons
#   "nerd"              - unicode plus nerd-font file/git/section icons
#   "ascii"             - pure ASCII text glyphs (v/> folds, +/- bars); frame
#                         borders still use box-drawing, which every terminal has
glyphs = "unicode"
# Deprecated: nerd_fonts = true is equivalent to glyphs = "nerd" (used only when
# `glyphs` is unset).
# nerd_fonts = false
# Capture mouse events: wheel scroll, click-to-focus, and double-click (which
# acts like Return - open the commit/file/diff line). On by default (like
# lazygit) so the wheel scrolls rgit rather than the host terminal/editor when
# embedded. Set false to keep the terminal's native text selection.
mouse = true
# Render read-only diffs (commit / diff views) side by side.
side_by_side = false
# Which regions let the terminal background show through:
#   "off"  (default) - paint everything solid, matching the design
#   "body"           - solid header and action bar, see-through body
#   "full"           - fully transparent
transparent = "off"

# Active keybinding profile:
#   "magit" / "emacs" (default) - single-letter actions plus emacs/readline
#                       navigation; C-Spc set-mark, M-w copy.
#   "vim"             - hjkl motion, gg/G, Ctrl-d/u, and a Space leader
#                       (which-key) for every git action. <Space>w h/l moves
#                       between panes; v starts a visual line selection and y
#                       yanks it to the system clipboard via OSC 52 (inside
#                       tmux, enable `set -g set-clipboard on`).
#   "<custom>"        - a profile you define under [profiles.<name>] below.
# profile = "vim"

[commit]
# Sign commits with git's -S (uses your git GPG/SSH signing config).
gpg_sign = false
# After an amend, reword, or extend, rebase branches stacked on the rewritten
# commit onto its new tip (jj/Sapling style). Set false to keep amend local.
auto_restack = true

# Rebind actions PER PROFILE, under [keys.<profile>]. Each profile has its own
# table, so you can configure emacs and vim independently in one file - only the
# active profile's overrides take effect. The value is a key spec: a bare
# character, or a chord using
#   C- or ^   ctrl        (e.g. "C-f", "^f")
#   M- or A-  alt          (e.g. "M-b")
#   C-x <k>   emacs prefix (e.g. "C-x o")
#   named keys: Up Down Left Right RET Tab Esc Spc Home End
# Action names use hyphens. Unknown names or unparseable keys are ignored.
#
# [keys.emacs]
# set-mark  = "M-Spc"      # move set-mark off C-Spc (e.g. it's your tmux leader)
# copy      = "M-w"        # copy the region (defaults: M-w and C-w)
# open-editor = "C-o"
#
# [keys.vim]
# copy = "Y"
# stage = "s"
#
# Every action is rebindable. Some common ones:
#   stage unstage discard commit rebase-menu merge-menu palette search
#   forward-char backward-char line-start line-end word-forward word-back
#   set-mark copy next-line prev-line other-window open-editor focus-preview
#
# Define YOUR OWN profile: base it on a built-in with `extends`, then customize
# its [keys.<name>]. Set `profile = "<name>"` above to use it.
#
# profile = "mine"
# [profiles.mine]
# extends = "emacs"        # inherit emacs bindings, then override below
# [keys.mine]
# stage = "S"
# set-mark = "M-Spc"
