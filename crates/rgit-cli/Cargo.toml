[package]
name = "rgit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2"
regex = "1"
rgit-forge.workspace = true
rgit-git.workspace = true
rgit-index.workspace = true
rgit-tui.workspace = true
rgit-web.workspace = true
serde.workspace = true
toml.workspace = true
# MCP structured content (a serde_json::Value) keeps schema key order.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rmcp = { version = "3", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = "0.8"

[[bin]]
name = "rgit"
path = "src/main.rs"

[dev-dependencies]
portable-pty = "0.9"
