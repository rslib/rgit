[package]
name = "rgit-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# ssh:// remotes handled in-process by russh (config-aware: honors ~/.ssh/config
# incl. ProxyJump/ProxyCommand and known_hosts), replacing libgit2's libssh2.
# On by default; --no-default-features drops ssh support (and libssh2 is not
# built either - git2 keeps only the https transport).
default = ["ssh"]
ssh = ["dep:russh", "dep:tokio", "dep:tokio-util", "dep:home", "dep:nix"]

[dependencies]
git2 = { version = "0.21.0", features = ["https", "vendored-openssl"] }
git2-hooks = "0.7.0"
# Raw calls git2 does not wrap (config origins, filters, hashfile).
libgit2-sys = "0.18"
# zlib itself, to deflate binary patches byte for byte as git does.
libz-sys = "1"
# Over that zlib too, so tgz and zip match git's bytes.
flate2 = { version = "1", features = ["zlib"] }
libc = "0.2"
grep = "0.3"
ignore = "0.4"
rayon = "1"
reflink-copy = "0.1"
regex = "1"
fancy-regex = "0.16"
sha1 = "0.10"
# The smart http transport for partial clones; base64 for its Basic auth.
ureq = "2"
base64 = "0.22"
thiserror = "2.0.20"
tracing.workspace = true
walkdir = "2"
russh = { version = "0.63", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["io-util"], optional = true }
home = { version = "0.5", optional = true }
nix = { version = "0.29", features = ["socket", "uio"], optional = true }
