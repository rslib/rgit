name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - id: v
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rgit-cli") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # ubuntu's musl-tools has no g++ (esaxx-rs via tokenizers needs
            # it); the cross image has the full toolchain. Binroot is in
            # RUNNER_TEMP so root-owned files never touch the checkout.
            image: messense/rust-musl-cross:x86_64-musl
            pre: ""
            binroot: $RUNNER_TEMP/musl-target
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            image: messense/rust-musl-cross:aarch64-musl
            # The image ships rustc 1.95, below the workspace rust-version.
            pre: rustup toolchain install 1.96 --profile minimal && rustup default 1.96 && rustup target add aarch64-unknown-linux-musl &&
            binroot: $RUNNER_TEMP/musl-target
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            image: ""
            pre: ""
            binroot: target
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: runner.os == 'macOS'
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      - name: Build
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/musl-target" "$RUNNER_TEMP/musl-registry"
          docker run --rm \
            -v "$PWD":/src -w /src \
            -v "$RUNNER_TEMP/musl-target":/src/target \
            -v "$RUNNER_TEMP/musl-registry":/root/.cargo/registry \
            ${{ matrix.image }} \
            sh -c '${{ matrix.pre }} cargo build --release --locked --target ${{ matrix.target }} -p rgit-cli'
      - name: Build
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }} -p rgit-cli
      - name: The Linux binary is static
        if: runner.os == 'Linux'
        run: |
          bin="${{ matrix.binroot }}/${{ matrix.target }}/release/rgit"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "$bin links shared libraries"
            exit 1
          fi
      - name: The binary runs and reports the version
        run: |
          out=$("${{ matrix.binroot }}/${{ matrix.target }}/release/rgit" --version)
          echo "$out"
          echo "$out" | grep -q "$VERSION"
      - name: Pack
        run: |
          archive="rgit-${{ matrix.name }}-v$VERSION.tar.gz"
          mkdir -p pkg
          cp "${{ matrix.binroot }}/${{ matrix.target }}/release/rgit" pkg/rgit
          tar -czf "$archive" -C pkg rgit
          shasum -a 256 "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rgit-${{ matrix.name }}
          path: rgit-${{ matrix.name }}-v*.tar.gz*

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the archives
        run: |
          cd dist
          ls -l
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 3
          sha256sum -c -- ./*.sha256
      - name: Release notes
        run: .github/scripts/changelog.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" | tee notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
