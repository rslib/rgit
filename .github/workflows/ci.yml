name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The parity tests null out global git config and commit as the
      # current user; dotless CI hostnames make git's identity
      # auto-detection fail, so hand it one.
      GIT_AUTHOR_NAME: rgit CI
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: rgit CI
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo test --all-targets

  musl:
    name: Musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu's musl-tools has no g++, which esaxx-rs (via tokenizers)
      # needs; the cross image has the full toolchain. Target and registry
      # live in RUNNER_TEMP so root-owned files never touch the checkout.
      - name: Build in the musl cross image (musl has cfg'd code gnu never compiles)
        run: |
          mkdir -p "$RUNNER_TEMP/musl-target" "$RUNNER_TEMP/musl-registry"
          docker run --rm \
            -v "$PWD":/src -w /src \
            -v "$RUNNER_TEMP/musl-target":/src/target \
            -v "$RUNNER_TEMP/musl-registry":/root/.cargo/registry \
            messense/rust-musl-cross:x86_64-musl \
            cargo build --locked --target x86_64-unknown-linux-musl -p rgit-cli
      - name: The binary is static
        run: |
          bin="$RUNNER_TEMP/musl-target/x86_64-unknown-linux-musl/debug/rgit"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          ! ldd "$bin" 2>&1 | grep -q '=>'
