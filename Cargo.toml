[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rayandrew/rgit"
rust-version = "1.85"

[workspace.dependencies]
rgit-git = { path = "crates/rgit-git" }
rgit-index = { path = "crates/rgit-index" }
rgit-model = { path = "crates/rgit-model" }
rgit-tui = { path = "crates/rgit-tui" }
rgit-web = { path = "crates/rgit-web" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
octocrab = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
