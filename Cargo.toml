[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/rayandrew/rgit"
rust-version = "1.96"

# Releases are GitHub-only: the tag push triggers .github/workflows/release.yml,
# which builds and publishes the binaries. No crates.io publishing.
[workspace.metadata.release]
publish = false
push = true
# One consolidated tag for the whole workspace; release.yml triggers on v*.
tag-name = "v{{version}}"

[workspace.dependencies]
rgit-forge = { path = "crates/rgit-forge" }
rgit-git = { path = "crates/rgit-git" }
rgit-index = { path = "crates/rgit-index" }
rgit-model = { path = "crates/rgit-model" }
rgit-tui = { path = "crates/rgit-tui" }
rgit-web = { path = "crates/rgit-web" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
octocrab = "0.54"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
toml = "1"

# Release/install builds only (dev debug builds are untouched). A smaller binary
# makes the one-time macOS code-signature check on first launch - the "slow
# startup" - noticeably faster, and cuts cold page-in too.
[profile.release]
strip = true        # drop symbols
lto = "fat"         # dead-code elimination + cross-crate inlining
codegen-units = 1   # smaller, better-optimized code (slower release compile)
